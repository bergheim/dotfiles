# Hyprland config adapted from stash/sway-config and stash/niri/config.kdl.
# Install on the host as ~/.config/hypr/hyprland.conf.

################
### MONITORS ###
################

# Safe first-launch fallback. Run `hyprctl monitors all` inside Hyprland before
# pinning outputs explicitly.
monitor = , preferred, auto, auto

# Sway pins workspaces 1-9 to DP-0 and 10-13 to DP-2. Uncomment after verifying
# these names still match `hyprctl monitors all`.
# workspace = 1, monitor:DP-0
# workspace = 2, monitor:DP-0
# workspace = 3, monitor:DP-0
# workspace = 4, monitor:DP-0
# workspace = 5, monitor:DP-0
# workspace = 6, monitor:DP-0
# workspace = 7, monitor:DP-0
# workspace = 8, monitor:DP-0
# workspace = 9, monitor:DP-0
# workspace = 10, monitor:DP-2
# workspace = 11, monitor:DP-2
# workspace = 12, monitor:DP-2
# workspace = 13, monitor:DP-2

################
### PROGRAMS ###
################

$terminal = ghostty
$menu = fuzzel
$lock = fancylocksway

#################
### AUTOSTART ###
#################

exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user start emacs.service
exec-once = waybar
exec-once = mako
# swayosd disabled 2026-08-18: amdgpu/TTM LRU hardlock test (denote 20260601T112404)
# exec-once = swayosd-server
exec-once = kanshi
exec-once = swaybg -i /home/tsb/Pictures/wallpapers/active/light/primary.jpg -m fill
exec-once = wl-paste --watch cliphist store
exec-once = swayidle -w timeout 300 'fancylocksway' timeout 600 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' timeout 1800 'systemctl suspend-then-hibernate' before-sleep 'fancylocksway' after-resume 'hyprctl dispatch dpms on' lock 'fancylocksway'

###################
### ENVIRONMENT ###
###################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 10
    gaps_out = 5
    border_size = 1

    col.active_border = rgba(c0df6fff)
    col.inactive_border = rgba(1d2021cc)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 5
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(00000080)
        offset = 0 5
    }

    blur {
        enabled = true
        size = 5
        passes = 5
        noise = 0.4
        brightness = 1.0
        contrast = 1.0
        vibrancy = 0.0
    }
}

# Sway has no compositor animations; keep Hyprland close to that.
animations {
    enabled = false
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

#############
### INPUT ###
#############

cursor {
    inactive_timeout = 2
}

input {
    kb_layout = us,no
    kb_variant = altgr-intl
    kb_model =
    kb_options = grp:win_space_toggle,caps:escape
    kb_rules =

    repeat_rate = 50
    repeat_delay = 180
    numlock_by_default = true

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        disable_while_typing = true
        tap-to-click = true
        middle_button_emulation = true
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER
$alt = ALT

$ws1 = 1
$ws2 = 2
$ws3 = 3
$ws4 = 4
$ws5 = 5
$ws6 = 6
$ws7 = 7
$ws8 = 8
$ws9 = 9
$ws10 = 10
$ws11 = 11
$ws12 = 12
$ws13 = 13

# Apps and launchers.
bind = $mainMod SHIFT, Return, exec, $terminal
bind = $mainMod, Return, exec, emacsclient -nc
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, exec, fuzzel-pass
bind = $mainMod, C, exec, cliphist list | fuzzel -d | cliphist decode | wl-copy
bind = $mainMod SHIFT, E, exec, BEMOJI_PICKER_CMD='fuzzel -d' bemoji
bind = $mainMod, V, exec, emacsclient --eval "(emacs-everywhere)"
bind = $mainMod, Z, exec, emacsclient -c -F '((name . "floating") (width . 80) (height . 52) (tab-bar-lines . 0) (menu-bar-lines . 0) (tool-bar-lines . 0) (undecorated . t) (fullscreen . 0))' --eval "(bergheim/capture)"
bind = $mainMod, T, exec, emacs-clock-in
bind = $mainMod, Escape, exec, $lock
bind = $mainMod, F1, exec, toggle-darkmode
bind = $mainMod, F2, exec, (pkill gammastep && notify-send "Disabling color temperature") || (notify-send "Enabling color temperature" && gammastep)
bind = $mainMod, F5, exec, alacritty --class floating -e impala
bind = $mainMod, F6, exec, hyprctl reload
bind = $mainMod SHIFT, C, exec, fuzzel-cliphist
bind = $mainMod, F12, exec, journalctl --user -u hyprland -u Hyprland -n 100 > /tmp/hyprland-debug.log && notify-send "Hyprland log dumped"

# Session/system actions.
bind = CTRL ALT, Delete, exec, sh -c '[ "$(printf "NO\nYES" | fuzzel -d -p "Really restart system? ")" = "YES" ] && restart-system'
bind = $mainMod SHIFT, Q, exec, sh -c 'choice=$(printf "lock\nlogout\nsuspend\nreboot\nshutdown\nuefi\n" | fuzzel -d -p "System: "); case "$choice" in lock) fancylocksway ;; logout) hyprctl dispatch exit ;; suspend) systemctl suspend ;; reboot) systemctl reboot ;; shutdown) systemctl poweroff -i ;; uefi) systemctl reboot --firmware-setup ;; esac'

# Window lifecycle and layout.
bind = $mainMod, BackSpace, killactive
bind = $mainMod SHIFT, BackSpace, forcekillactive
bind = $mainMod $alt, F, togglefloating
bind = $mainMod SHIFT, F, exec, hyprctl dispatch fullscreen 0 unset; hyprctl dispatch togglefloating; hyprctl dispatch resizeactive exact 1920 1080; hyprctl dispatch centerwindow; hyprctl dispatch pin
bind = $mainMod, F, fullscreen
bind = $mainMod, X, changegroupactive, f
bind = $mainMod SHIFT, X, changegroupactive, b
bind = $mainMod, Backslash, togglesplit
bind = $mainMod, S, togglespecialworkspace, scratch
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:scratch
bind = $mainMod, grave, togglespecialworkspace, scratch
bind = $mainMod SHIFT, grave, movetoworkspacesilent, special:scratch

# Focus movement: vim keys and arrows.
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# Move windows.
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# Direct resize binds from Sway.
bind = $mainMod $alt, L, resizeactive, 10 0
bind = $mainMod $alt, H, resizeactive, -10 0
bind = $mainMod $alt SHIFT, L, resizeactive, -10 0
bind = $mainMod $alt SHIFT, H, resizeactive, 10 0
bind = $mainMod $alt, J, resizeactive, 0 10
bind = $mainMod $alt, K, resizeactive, 0 -10
bind = $mainMod $alt SHIFT, J, resizeactive, 0 -10
bind = $mainMod $alt SHIFT, K, resizeactive, 0 10

# Workspace navigation.
bind = $mainMod CTRL, L, workspace, e+1
bind = $mainMod CTRL, H, workspace, e-1
bind = $mainMod, Tab, workspace, previous
bind = $alt, Tab, cyclenext
bind = $alt, Tab, bringactivetotop
bind = $mainMod, Space, cyclenext
bind = $mainMod, Space, bringactivetotop
bind = $mainMod, A, focusurgentorlast
bind = $mainMod, N, focusmonitor, +1
bind = $mainMod SHIFT, N, movecurrentworkspacetomonitor, +1

# Sway-style workspace key map.
bind = $mainMod, 1, workspace, $ws1
bind = $mainMod, 2, workspace, $ws2
bind = $mainMod, 3, workspace, $ws3
bind = $mainMod, Q, workspace, $ws4
bind = $mainMod, W, workspace, $ws5
bind = $mainMod, E, workspace, $ws6
bind = $mainMod, 4, workspace, $ws7
bind = $mainMod, 5, workspace, $ws8
bind = $mainMod, 6, workspace, $ws9
bind = $mainMod, 7, workspace, $ws10
bind = $mainMod, 8, workspace, $ws11
bind = $mainMod, 9, workspace, $ws12
bind = $mainMod, 0, workspace, $ws13

bind = $mainMod $alt, 1, movetoworkspace, $ws1
bind = $mainMod $alt, 2, movetoworkspace, $ws2
bind = $mainMod $alt, 3, movetoworkspace, $ws3
bind = $mainMod $alt, Q, movetoworkspace, $ws4
bind = $mainMod $alt, W, movetoworkspace, $ws5
bind = $mainMod $alt, E, movetoworkspace, $ws6
bind = $mainMod $alt, 4, movetoworkspace, $ws7
bind = $mainMod $alt, 5, movetoworkspace, $ws8
bind = $mainMod $alt, 6, movetoworkspace, $ws9
bind = $mainMod $alt, 7, movetoworkspace, $ws10
bind = $mainMod $alt, 8, movetoworkspace, $ws11
bind = $mainMod $alt, 9, movetoworkspace, $ws12
bind = $mainMod $alt, 0, movetoworkspace, $ws13

# Mouse movement/resizing.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots.
bind = , Print, exec, sh -c 'FILE=~/Pictures/screenshots/$(date -u "+%Y%m%dT%H%M%S")--screenshot-local__.png; grim "$FILE" && notify-send "Screenshot saved" "$(basename "$FILE")" && vips thumbnail "$FILE" ".webp[Q=80]" 1920 --height 1200 --size down > "${FILE%.png}.webp" && rm "$FILE"'
bind = SHIFT, Print, exec, sh -c 'FILE=~/Pictures/screenshots/$(date -u "+%Y%m%dT%H%M%S")--screenshot-shared__.png; grim -g "$(slurp)" "$FILE" && notify-send "Screenshot saved, uploading..." && vips thumbnail "$FILE" ".webp[Q=80]" 1920 --height 1200 --size down | curl --form "file=@-" -Fsecret= -Fexpires=24 http://0x0.st | wl-copy && notify-send "URL copied" || notify-send "Upload failed"'

# Notifications.
bind = $mainMod CTRL, grave, exec, makoctl dismiss
bind = $mainMod CTRL, 1, exec, makoctl restore
bind = $mainMod, D, exec, mako-actions
bind = $mainMod CTRL, 3, exec, makoctl dismiss --all

# Laptop multimedia keys.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, backlight-step up
bindel = , XF86MonBrightnessDown, exec, backlight-step down

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Floating rules from Sway.
windowrule {
    name = float-qalculate
    match:class = ^qalculate-gtk$
    float = true
}

windowrule {
    name = float-teams-notification
    match:title = ^Microsoft Teams Notification$
    float = true
}

windowrule {
    name = float-calendar
    match:class = ^gnome-calendar$
    float = true
}

windowrule {
    name = float-app-id-prefix
    match:class = ^floating
    float = true
}

windowrule {
    name = float-title-floating
    match:title = floating
    float = true
    size = 90% 90%
    center = true
}

windowrule {
    name = float-pip
    match:title = Picture-in-Picture
    float = true
    pin = true
}

# Auto-place on workspaces.
windowrule {
    name = chat-telegram
    match:class = ^TelegramDesktop$
    workspace = 2
}

windowrule {
    name = music-spotify
    match:class = ^Spotify$
    workspace = 3
}

windowrule {
    name = chat-teams
    match:class = ^Microsoft Teams - Preview$
    workspace = 2
}

windowrule {
    name = chat-discord
    match:class = ^discord$
    workspace = 2
}

windowrule {
    name = chat-slack
    match:class = ^Slack$
    workspace = 2
}

windowrule {
    name = chat-element
    match:class = ^Element
    workspace = 2
}

windowrule {
    name = email-chromium
    match:class = ^Chromium$
    workspace = 4
}
