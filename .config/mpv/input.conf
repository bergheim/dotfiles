# Vim-shaped navigation; all unlisted mpv defaults remain enabled.
h seek -5
l seek 5
H seek -60
L seek 60
j add volume -2
k add volume 2
g seek 0 absolute
G seek -1 absolute

# Subtitle tracks (moved from j; native J still selects the previous track).
Alt+j cycle sub
Alt+k cycle sub down

# Playlist navigation, with both directional and next/previous mnemonics.
Alt+h playlist-prev
Alt+l playlist-next
Alt+p playlist-prev
Alt+n playlist-next

# Preserve the actions displaced from l, L, and G.
Ctrl+l ab-loop
Ctrl+Shift+l cycle-values loop-file "inf" "no"
Alt+g add sub-scale +0.1
