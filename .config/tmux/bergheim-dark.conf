# Theme — Gotham. Colors only; layout is in ~/.tmux.conf.

set -g status-style 'fg=#98d1ce bg=#0a0f14'
set -g status-left-style 'fg=#26c98b bold'
set -g status-right-style 'fg=#33859d'

# make the current window pop
setw -g window-status-current-style 'fg=#0a0f14 bg=#26c98b bold'
setw -g window-status-style 'fg=#33859d'
setw -g window-status-bell-style 'fg=#0a0f14 bg=#e74c3c bold'

set -g message-style 'fg=#0a0f14 bg=#edb54b'
set -g pane-active-border-style 'fg=#26c98b'
set -g pane-border-style 'fg=#2c3e50'
