# Theme — Alabaster / Catppuccin Latte. Colors only; layout is in ~/.tmux.conf.
# window-style paints the pane; must be set here or a dark toggle sticks.
# Lowercase hex only (see denote:20260825T173513).

set -g status-style 'fg=#4c4f69 bg=#eff1f5'
set -g status-left-style 'fg=#40a02b bold'
set -g status-right-style 'fg=#6c6f85'
set -g window-style 'fg=#4c4f69 bg=#eff1f5'
set -g window-active-style 'fg=#4c4f69 bg=#eff1f5'

# make the current window pop
setw -g window-status-current-style 'fg=#eff1f5 bg=#40a02b bold'
setw -g window-status-style 'fg=#8c8fa1'
setw -g window-status-bell-style 'fg=#eff1f5 bg=#d20f39 bold'

set -g message-style 'fg=#eff1f5 bg=#dc8a78'
set -g pane-active-border-style 'fg=#40a02b'
set -g pane-border-style 'fg=#bcc0cc'
