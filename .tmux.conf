# vim:set ft=tmux:

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# Count sessions start at 1
set -g base-index 1
setw -g pane-base-index 1

set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"

# Ghostty Mode 2031 → tmux; restyle the local Emacs daemon (SSH clients too).
# Gated on the socket so it is a no-op in containers and on hosts without a daemon.
set-hook -g client-light-theme {
    if-shell 'test -S /run/user/1000/emacs/server' {
        run-shell -b "/home/tsb/local/bin/emacsclient -s /run/user/1000/emacs/server -a false -e '(bergheim/theme-light)' >/dev/null 2>&1"
    }
}
set-hook -g client-dark-theme {
    if-shell 'test -S /run/user/1000/emacs/server' {
        run-shell -b "/home/tsb/local/bin/emacsclient -s /run/user/1000/emacs/server -a false -e '(bergheim/theme-dark)' >/dev/null 2>&1"
    }
}
set-hook -g client-attached[0] {
    if-shell 'test -S /run/user/1000/emacs/server' {
        if-shell -F '#{==:#{client_theme},light}' {
            run-shell -b "/home/tsb/local/bin/emacsclient -s /run/user/1000/emacs/server -a false -e '(bergheim/theme-light)' >/dev/null 2>&1"
        }
        if-shell -F '#{==:#{client_theme},dark}' {
            run-shell -b "/home/tsb/local/bin/emacsclient -s /run/user/1000/emacs/server -a false -e '(bergheim/theme-dark)' >/dev/null 2>&1"
        }
    }
}

set -g mouse on
set -g history-limit 10000

# unbind c-b, use c-space
unbind-key C-b
set -g prefix C-Space
bind Space send-prefix

# enable things like alt-hjkl. See https://github.com/tmux/tmux/wiki/Modifier-Keys
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',*:clipboard:sixel:extkeys:hyperlinks'
set -as terminal-features ',xterm*:strikethrough:usstyle:sync'

# allow bigger images
set -s input-buffer-size 4194304

# vi stuff
setw -g mode-keys vi
unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle

# Copy via OSC52, minus the whitespace before and after the selection.
# `external` keeps tmux from also pushing the raw selection; only the trimmed
# load-buffer -w reaches the clipboard.
set -g set-clipboard external
set -g @trim 'perl -0777 -pe "s/\A\s+//; s/\s+\z//" | tmux load-buffer -w -'

bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel '#{@trim}'
bind -T copy-mode-vi y     send -X copy-pipe '#{@trim}'
bind -T copy-mode Enter    send -X copy-pipe-and-cancel '#{@trim}'
bind -T copy-mode y        send -X copy-pipe '#{@trim}'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear '#{@trim}'
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear '#{@trim}'

# lots of this is based on https://gist.github.com/spicycode/1229612
bind-key v split-window -h
bind-key s split-window -v

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes. Breaks emacs remotely
# bind -n M-h select-pane -L
# bind -n M-j select-pane -D
# bind -n M-k select-pane -U
# bind -n M-l select-pane -R

# Alt-1..9 → window N in this session. Steals Emacs tab-bar M-1..6.
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Actually these are nicer for Emacs when working remotely
unbind-key M-h
unbind-key M-j
unbind-key M-k
unbind-key M-l
bind-key -n M-h send-keys M-h
bind-key -n M-j send-keys M-j
bind-key -n M-k send-keys M-k
bind-key -n M-l send-keys M-l

# Resize by adding shift
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Alt-n/p to switch windows
bind -n M-p  previous-window
bind -n M-n next-window

# Double tap space to toggle the last two windows
bind-key C-Space last-window

# Alt-N/P to move windows
bind-key -n M-P swap-window -t -1
bind-key -n M-N swap-window -t +1

# Ctrl-Alt-h/j/k/l to move panes
bind-key -n C-M-h swap-pane -d -t "{left-of}"
bind-key -n C-M-l swap-pane -d -t "{right-of}"
bind-key -n C-M-j swap-pane -d -t "{down-of}"
bind-key -n C-M-k swap-pane -d -t "{up-of}"

# default is choose-window, this shows panes as well
bind w choose-window
bind C-w choose-window

bind t choose-tree
# ! is already mapped to break-pane by default
# bind-key b break-pane

# send this pane into target pane
bind @ choose-tree 'join-pane -ht %%'

# bring another pane into this pane, horizontally
bind '#' split-window -h \; choose-tree 'kill-pane ; join-pane -hs %%'
bind S split-window -h \; choose-tree 'kill-pane ; join-pane -hs %%'

# bring another pane into this pane, vertically
bind V split-window -v \; choose-tree 'kill-pane ; join-pane -vs %%'

# send this window to another session
bind W split-window -v \; choose-tree 'kill-pane ; move-window -t %%'

# bring another window into this session
bind E split-window -v \; choose-tree 'kill-pane ; move-window -s %%'

# visual notification of activity in other windows
set -g visual-activity off
setw -g monitor-activity off

# Automatically set window title
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string '#h | #S | #W'

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

# Fuzzy-switch to any window in any session (fzf in a popup).
bind C-f display-popup -E -w 70% -h 60% ~/local/bin/tmux-fuzzy-window

# Fuzzy-search every pane's scrollback. Replaces find-window, which is
# glob-only and sees the visible screen but not history.
bind f display-popup -E -w 80% -h 70% ~/local/bin/tmux-fuzzy-find

# URLs in this pane's scrollback. Replaces tmux-urlview (needs AUR urlview).
# run-shell expands #{pane_id}; display-popup does not (man: only -T is a format).
bind u run-shell 'tmux display-popup -E -w 70% -h 40% ~/local/bin/tmux-fuzzy-url #{pane_id}'
bind U run-shell 'tmux display-popup -E -w 70% -h 40% ~/local/bin/tmux-fuzzy-url --copy #{pane_id}'

# this will automatically resize the screen up unless another client is actually
# looking at the session
setw -g aggressive-resize on

# Set XTerm key bindings
setw -g xterm-keys on

# clipboard sharing
set -g allow-passthrough all
set -g set-clipboard on

# Status bar layout. Chrome uses default + the 16 ANSI slots so Ghostty's
# palette swap restyles tmux (including SSH) without a reload.
set -g status-interval 30
set -g status-justify centre
set -g status-left-length 30
set -g status-left "#{?client_prefix,#[reverse],}  #h   #S #[noreverse]"
# Date and clock only when there are columns to spare; the WM already
# shows them, and termux needs the width.
set -g status-right "#{?#{>=:#{client_width},100},  %d %b   %H:%M ,}"
set -g display-time 1000
setw -g pane-border-status off

# Icon for whatever is running in the window's active pane. Innermost rule
# wins; the outer catch-all only fires on a bare command name, so it never
# clobbers an icon a rule already set. Add a command by wrapping one more
# #{s/pattern/icon/:...} around the chain.
set -g @cmd-icon "#{s/^[a-zA-Z0-9._+-]+$//:#{s/^ssh$//:#{s/^(docker|docker-compose|podman)$//:#{s/^(git|lazygit|tig|gitui)$//:#{s/^(python|python3|uv|ipython)$//:#{s/^(node|npm|pnpm|bun)$//:#{s/^(pi|claude|aider|agy)$//:#{s/^(emacs|emacsclient|em)$//:#{s/^(n?vim|hx|helix)$//:#{s/^(zsh|bash|fish|sh|dash)$//:#{pane_current_command}}}}}}}}}}}"

setw -g window-status-format         " #I:#{E:#{@cmd-icon}} #W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format " #I:#{E:#{@cmd-icon}} #W#{?window_zoomed_flag, Z,} "

# 16 ANSI colors so Ghostty's palette swap restyles prefix-f popups.
set-environment -g FZF_DEFAULT_OPTS '--color=base16,fg+:green:reverse,bg+:-1,hl+:green'

set -g status-style default
set -g status-left-style 'fg=green bold'
set -g status-right-style default
set -g window-style default
set -g window-active-style default

setw -g window-status-current-style 'fg=green bg=default reverse bold'
setw -g window-status-style default
setw -g window-status-bell-style 'fg=red bg=default reverse bold'

set -g message-style 'fg=yellow bg=default reverse'
set -g mode-style 'fg=green bg=default reverse'
set -g pane-active-border-style 'fg=green'
set -g pane-border-style 'fg=brightblack'
set -g popup-style default
set -g popup-border-style 'fg=green'

set -as terminal-overrides ',xterm-256color:Ms=\E]52;c%p1%.0s;%p2%s\7'
set -as terminal-overrides ',*:Ms=\E]52;c%p1%.0s;%p2%s\7'
